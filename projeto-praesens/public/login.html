<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Praesens - Entrar</title>

    <link rel="icon" type="image/svg+xml" href="./assets/icon/favicon.svg" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@300;400;700&display=swap"
    />

    <link rel="stylesheet" href="./css/estilo.css" />

    <style>
      .conteudo-central {
        padding: 40px 24px;
      }

      .cartao-login {
        width: 100%;
        max-width: 380px;
        padding: 40px 32px;
        background-color: #19211d;
        border-radius: 24px 0 24px 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .cartao-login h1 {
        font-family: "Marcellus", serif;
        font-size: 32px;
        font-weight: 400;
        text-align: center;
        margin: 0 0 8px 0;
      }

      .cartao-login .botao {
        margin-top: 8px;
        padding: 14px;
      }

      .campo {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
        font-weight: 700;
      }

      .campo input {
        padding: 12px;
        font-family: "Nunito Sans", sans-serif;
        font-size: 16px;
        color: #a9cba3;
        background-color: #0e1612;
        border: 1px solid #434840;
        border-radius: 8px;
        outline: none;
      }

      .campo input:focus {
        border-color: #ddaa4f;
      }

      .mensagem {
        min-height: 20px;
        font-size: 14px;
        text-align: center;
        color: #ddaa4f;
      }

      .link-cadastro {
        font-size: 14px;
        text-align: center;
      }

      .link-cadastro a {
        color: #ddaa4f;
        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <div class="cabecalho">
      <div class="logo-praesens">
        <img src="assets/readme/logo.svg" alt="Samambaia" />
        <span>Praesens</span>
      </div>
      <div class="menu">
        <a href="index.html">Início</a>
        <a class="pagina-atual" href="login.html">Entrar</a>
        <a href="cadastro.html">Criar conta</a>
      </div>
    </div>

    <div class="conteudo-central">
      <div class="cartao-login">
        <h1>Preencha para entrar</h1>

        <div class="campo">
          <span>E-mail</span>
          <input
            id="ipt_email"
            type="text"
            placeholder="seuemail@exemplo.com"
          />
        </div>

        <div class="campo">
          <span>Senha</span>
          <input
            id="ipt_senha"
            type="password"
            placeholder="Mínimo de 8 caracteres"
          />
        </div>

        <button class="botao" onclick="entrar()">Entrar</button>

        <div class="mensagem" id="div_mensagem"></div>

        <div class="link-cadastro">
          Se não tiver conta clique em: <a href="cadastro.html">Criar conta</a>
        </div>
      </div>
    </div>

    <div class="rodape">
      <span
        >Esse é um projeto acadêmico feito com o objetivo de testar meus
        conhecimentos técnicos.</span
      >
      <span
        >Criado por:
        <a
          href="https://github.com/paulodesouza-dev"
          target="_blank"
          style="color: #ccff6c"
          >Paulo Henrique de Souza</a
        ></span
      >
    </div>
  </body>
</html>

<script>
  function entrar() {
    let email = ipt_email.value;
    let senha = ipt_senha.value;

    if (email == "" || senha == "") {
      div_mensagem.innerHTML = "Preencha todos os campos.";
    } else if (!email.includes("@") || !email.includes(".")) {
      div_mensagem.innerHTML = "Digite um e-mail válido.";
    } else if (senha.length < 8) {
      div_mensagem.innerHTML = "A senha precisa ter pelo menos 8 caracteres.";
    } else {
      div_mensagem.innerHTML = "Entrando...";

      fetch("/usuarios/autenticar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          emailServer: email,
          senhaServer: senha,
        }),
      }).then(function (resposta) {
        if (resposta.ok) {
          resposta.json().then(function (usuario) {
            sessionStorage.ID_USUARIO = usuario.id;
            sessionStorage.NOME_USUARIO = usuario.nome;
            sessionStorage.EMAIL_USUARIO = usuario.email;
            window.location = "dashboard.html";
          });
        } else {
          div_mensagem.innerHTML = "E-mail ou senha incorretos.";
        }
      });
    }
  }
</script>
