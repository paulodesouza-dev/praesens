<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Praesens - Entrar</title>

    <link rel="icon" type="image/svg+xml" href="./assets/icon/favicon.svg" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@300;400;700&display=swap"
    />

    <link rel="stylesheet" href="./css/estilo.css" />

    <style>
      .conteudo-central {
        padding: 40px 24px;
      }
    </style>
  </head>

  <body>
    <div class="cabecalho">
      <div class="logo-praesens">
        <img src="assets/readme/logo.svg" alt="Samambaia" />
        <span>Praesens</span>
      </div>
      <div class="menu">
        <a href="index.html">Início</a>
        <a class="pagina-atual" href="login.html">Entrar</a>
        <a href="cadastro.html">Criar conta</a>
      </div>
    </div>

    <div class="conteudo-central">
      <div class="cartao">
        <h1>Preencha para entrar</h1>

        <div class="campo">
          <span>Email</span>
          <input
            id="ipt_email"
            type="text"
            placeholder="paulosouza@teste.com"
          />
        </div>

        <div class="campo">
          <span>Senha</span>
          <input
            id="ipt_senha"
            type="password"
            placeholder="Mínimo de 8 caracteres"
          />
        </div>

        <button class="botao" onclick="entrar()">Entrar</button>

        <div class="mensagem" id="div_mensagem"></div>

        <div class="link-cartao">
          Se não tiver conta clique em: <a href="cadastro.html">Criar conta</a>
        </div>
      </div>
    </div>

    <div class="rodape">
      <span
        >Esse é um projeto acadêmico feito com o objetivo de testar meus
        conhecimentos técnicos.</span
      >
      <span
        >Criado por:
        <a
          href="https://github.com/paulodesouza-dev"
          target="_blank"
          style="color: #ccff6c"
          >Paulo Henrique de Souza</a
        ></span
      >
    </div>
  </body>
</html>

<script>
  function entrar() {
    let email = ipt_email.value;
    let senha = ipt_senha.value;

    if (email == "" || senha == "") {
      div_mensagem.innerHTML = "Email e senha não podem estar vazios";
    } else if (!email.includes("@") || !email.includes(".")) {
      div_mensagem.innerHTML = "Email inválido!!";
    } else if (senha.length < 8) {
      div_mensagem.innerHTML = "Sua senha precisa ter pelo menos 8 caracteres";
    } else {

      fetch("/usuarios/autenticar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          emailServer: email,
          senhaServer: senha,
        }),
      }).then(function (resposta) {
        if (resposta.ok) {
          resposta.json().then(function (usuario) {
            sessionStorage.ID_USUARIO = usuario.id;
            sessionStorage.NOME_USUARIO = usuario.nome;
            sessionStorage.EMAIL_USUARIO = usuario.email;
            setTimeout(function () {
              window.location = "dashboard.html";
            }, 1000); // apenas para exibir o loading
          });
        } else {
          div_mensagem.innerHTML = "Email ou senha incorretos....";
        }
      });
    }
  }
</script>
