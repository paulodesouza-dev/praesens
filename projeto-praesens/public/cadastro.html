<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Praesens - Criar conta</title>

    <link rel="icon" type="image/svg+xml" href="./assets/icon/favicon.svg" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@300;400;700&display=swap"
    />

    <link rel="stylesheet" href="./css/estilo.css" />
  </head>

  <body>
    <div class="cabecalho">
      <div class="logo-praesens">
        <img src="assets/readme/logo.svg" alt="Samambaia" />
        <span>Praesens</span>
      </div>
      <div class="menu">
        <a href="index.html">Início</a>
        <a href="login.html">Entrar</a>
        <a class="pagina-atual" href="cadastro.html">Criar conta</a>
      </div>
    </div>

    <div class="conteudo-central">
      <div class="cartao">
        <h1>Crie sua conta</h1>

        <div class="campo">
          <span>Nome</span>
          <input id="ipt_nome" type="text" placeholder="Insira seu nome" />
        </div>

        <div class="campo">
          <span>Email</span>
          <input id="ipt_email" type="text" placeholder="seuemaill@teste.com" />
        </div>

        <div class="campo">
          <span>Senha</span>
          <input
            id="ipt_senha"
            type="password"
            placeholder="faça uma senha de no mínimo 8 caracteres"
            oninput="verificarSenha()"/>
          <div class="requisitos" id="div_requisitos"></div>
        </div>

        <div class="campo">
          <span>Confirmar senha</span>
          <input id="ipt_confirmar" type="password" placeholder="digite a senha novamente" />
        </div>

        <button class="botao" onclick="cadastrar()">Criar conta</button>

        <div class="mensagem" id="div_mensagem"></div>

        <div class="link-cartao">
          Se já tiver conta clique em: <a href="login.html">Entrar</a>
        </div>
      </div>
    </div>

    <div class="rodape">
      <span
        >Esse é um projeto acadêmico feito com o objetivo de testar meus
        conhecimentos técnicos.</span>
      <span> Criado por: <a href="https://github.com/paulodesouza-dev" target="_blank" style="color: #ccff6c">Paulo Henrique de Souza</a> </span>
    </div>
  </body>
</html>

<script>
  let espacos = 0;
  let maiusculas = 0;
  let minusculas = 0;

  function verificarSenha() {
    let senha = ipt_senha.value;
    espacos = 0;
    maiusculas = 0;
    minusculas = 0;

    for (let i = 0; i < senha.length; i++) {
      if (senha[i] == " ") {
        espacos++;
      } else if (senha[i] != senha[i].toLowerCase()) {
        maiusculas++;
      } else if (senha[i] != senha[i].toUpperCase()) {
        minusculas++;
      }
    }

    let requisitos = "";

    if (senha.length >= 8) {
      requisitos += `<span class="requisito-ok">Pelo menos 8 caracteres</span>`;
    } else {
      requisitos += `<span class="requisito-falta">Pelo menos 8 caracteres</span>`;
    }

    if (maiusculas > 0) {
      requisitos += `<span class="requisito-ok">Uma letra maiúscula</span>`;
    } else {
      requisitos += `<span class="requisito-falta">Uma letra maiúscula</span>`;
    }

    if (minusculas > 0) {
      requisitos += `<span class="requisito-ok">Uma letra minúscula</span>`;
    } else {
      requisitos += `<span class="requisito-falta">Uma letra minúscula</span>`;
    }

    div_requisitos.innerHTML = requisitos;
  }

  function cadastrar() {
    let nome = ipt_nome.value;
    let email = ipt_email.value;
    let senha = ipt_senha.value;
    let confirmar = ipt_confirmar.value;

    verificarSenha();

    if (nome == "" || email == "" || senha == "" || confirmar == "") {
      div_mensagem.innerHTML = "Nome email e senha não podem estar vazios";
    } else if (!email.includes("@") || !email.includes(".")) {
      div_mensagem.innerHTML = "Email inválido!!";
    } else if (senha.length < 8) {
      div_mensagem.innerHTML = "Sua senha precisa ter pelo menos 8 caracteres";
    } else if (maiusculas == 0 || minusculas == 0) {
      div_mensagem.innerHTML = "Sua senha precisa ter uma letra maiúscula e uma minúscula";
    } else if (espacos > 0) {
      div_mensagem.innerHTML = "A senha não pode ter espaços";
    } else if (senha != confirmar) {
      div_mensagem.innerHTML = "As senhas não são iguais";
    } else {






      
      // Enviando o valor da nova input
      fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          // crie um atributo que recebe o valor recuperado aqui
          // Agora vá para o arquivo routes/usuario.js
          nomeServer: nome,
          emailServer: email,
          senhaServer: senha,
        }),
      }).then(function (resposta) {
        if (resposta.ok) {
          resposta.json().then(function (usuario) {
            sessionStorage.ID_USUARIO = usuario.id;
            sessionStorage.NOME_USUARIO = usuario.nome;
            sessionStorage.EMAIL_USUARIO = usuario.email;
            div_mensagem.innerHTML = "Cadastro feito, vamos respirar!!!";
            setTimeout(function () {
              window.location = "pratica.html";
            }, 2000);
          });
        } else {
          div_mensagem.innerHTML = "Algum erro ao tentar realizar o cadastro";
        }
      });
    }
  }
</script>
