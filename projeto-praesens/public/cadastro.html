<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Praesens - Criar conta</title>

    <link rel="icon" type="image/svg+xml" href="./assets/icon/favicon.svg" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@300;400;700&display=swap"
    />

    <link rel="stylesheet" href="./css/estilo.css" />

    <style>
      .conteudo-central {
        padding: 40px 24px;
      }
    </style>
  </head>

  <body>
    <div class="cabecalho">
      <div class="logo-praesens">
        <img src="assets/readme/logo.svg" alt="Samambaia" />
        <span>Praesens</span>
      </div>
      <div class="menu">
        <a href="index.html">Início</a>
        <a href="login.html">Entrar</a>
        <a class="pagina-atual" href="cadastro.html">Criar conta</a>
      </div>
    </div>

    <div class="conteudo-central">
      <div class="cartao">
        <h1>Crie sua conta</h1>

        <div class="campo">
          <span>Nome</span>
          <input id="ipt_nome" type="text" placeholder="Paulo Souza" />
        </div>

        <div class="campo">
          <span>Email</span>
          <input id="ipt_email" type="text" placeholder="paulosouza@teste.com" />
        </div>

        <div class="campo">
          <span>Senha</span>
          <input id="ipt_senha" type="password" placeholder="Mínimo de 8 caracteres" />
        </div>

        <button class="botao" onclick="cadastrar()">Criar conta</button>

        <div class="mensagem" id="div_mensagem"></div>

        <div class="link-cartao">
          Se já tiver conta clique em: <a href="login.html">Entrar</a>
        </div>
      </div>
    </div>

    <div class="rodape">
      <span>Esse é um projeto acadêmico feito com o objetivo de testar meus conhecimentos técnicos.</span>
      <span>Criado por: <a href="https://github.com/paulodesouza-dev" target="_blank" style="color: #ccff6c">Paulo Henrique de Souza</a></span>
    </div>
  </body>
</html>

<script>
  function cadastrar() {
    let nome = ipt_nome.value;
    let email = ipt_email.value;
    let senha = ipt_senha.value;

    if (nome == "" || email == "" || senha == "") {
      div_mensagem.innerHTML = "Nome, email e senha não podem estar vazios";
    } else if (!email.includes("@") || !email.includes(".")) {
      div_mensagem.innerHTML = "Email inválido!!";
    } else if (senha.length < 8) {
      div_mensagem.innerHTML = "Sua senha precisa ter pelo menos 8 caracteres";
    } else {

      // Enviando o valor da nova input
      fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          // crie um atributo que recebe o valor recuperado aqui
          // Agora vá para o arquivo routes/usuario.js
          nomeServer: nome,
          emailServer: email,
          senhaServer: senha,
        }),
      }).then(function (resposta) {
        if (resposta.ok) {
          div_mensagem.innerHTML = "Cadastro realizado com sucesso! Redirecionando para tela de Login...";
          setTimeout(function () {
            window.location = "login.html";
          }, 2000);
        } else {
          div_mensagem.innerHTML = "Houve um erro ao tentar realizar o cadastro!";
        }
      });
    }
  }
</script>
